<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — StickPro Custom Stickers &amp; Labels</title>
  <meta name="description" content="Sign up for StickPro to start ordering custom stickers, die-cut labels, packaging seals, and get instant digital proofs.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo.png">
  <script>
    (function(){
      try {
        var t = localStorage.getItem('stickpro-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        var d = localStorage.getItem('stickpro-direction') || 'ltr';
        document.documentElement.setAttribute('dir', d);
      } catch(e) {}
    })();
  </script>
</head>
<body class="auth-body">

  <!-- Floating Utility Controls (Theme & Direction Toggle) -->
  <div class="auth-quick-utils">
    <button class="header-util-btn theme-toggle" id="authThemeToggle" aria-label="Toggle dark mode" title="Toggle theme" aria-pressed="false">
      <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="header-util-btn dir-toggle" id="authDirToggle" aria-label="Switch layout direction" title="Toggle RTL / LTR direction" aria-pressed="false">
      <span class="dir-toggle-text">RTL</span>
    </button>
  </div>

  <main class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo + Typography (Clicks redirect to Home Page) -->
      <a href="index.html" class="auth-brand" title="Return to StickPro Home">
        <img class="logo-mark" src="logo.png" alt="StickPro logo">
        <span class="auth-brand-text">
          <span class="auth-brand-name">StickPro</span>
          <span class="auth-brand-tag">Custom Stickers &amp; Labels</span>
        </span>
      </a>

      <!-- Welcome Heading & Subtitle -->
      <div class="auth-header">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Join StickPro to design, proof, and print custom stickers and labels.</p>
      </div>

      <!-- Sign Up Form -->
      <form class="auth-form" id="signupForm" novalidate>
        
        <!-- Full Name Input -->
        <div class="form-group">
          <label for="signupName">Full name</label>
          <div class="auth-input-wrap">
            <input 
              type="text" 
              id="signupName" 
              name="name" 
              class="auth-input" 
              placeholder="Your full name" 
              required 
              autocomplete="name"
            >
          </div>
        </div>

        <!-- Email Input -->
        <div class="form-group">
          <label for="signupEmail">Work or personal email</label>
          <div class="auth-input-wrap">
            <input 
              type="email" 
              id="signupEmail" 
              name="email" 
              class="auth-input" 
              placeholder="you@example.com" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="auth-input-wrap">
            <input 
              type="password" 
              id="signupPassword" 
              name="password" 
              class="auth-input auth-input-has-icon" 
              placeholder="Create a strong password (8+ characters)" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="auth-pw-toggle" id="toggleSignupPassword" aria-label="Toggle password visibility" title="Show or hide password">
              <!-- Eye Icon (Show) -->
              <svg class="pw-eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye Slash Icon (Hide) -->
              <svg class="pw-eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Terms Agreement -->
        <div class="auth-terms-text">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
            <span>I agree to StickPro's <a href="contact.html">Terms of Service</a> and <a href="contact.html">Privacy Policy</a>.</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit" id="signupSubmitBtn">
          <span>Create Account</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span>or continue with</span>
      </div>

      <!-- Third-Party Login Options (Real Google & Apple Logos) -->
      <div class="social-auth-grid">
        
        <!-- Google Sign Up -->
        <button type="button" class="btn-social btn-social-google" aria-label="Sign up with Google">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.97 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Google</span>
        </button>

        <!-- Apple Sign Up -->
        <button type="button" class="btn-social btn-social-apple" aria-label="Sign up with Apple">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.98.6-2.61 1.34-.56.64-1.04 1.68-.91 2.7 1 .08 2.01-.48 2.6-1.19z"/>
          </svg>
          <span>Apple</span>
        </button>

      </div>

      <!-- Redirection to Login Page -->
      <div class="auth-switch">
        <span>Already have an account?</span>
        <a href="login.html">Log in</a>
      </div>

    </div>
  </main>

  <script>
    (function () {
      "use strict";

      // Password visibility toggle
      var toggleBtn = document.getElementById("toggleSignupPassword");
      var passwordInput = document.getElementById("signupPassword");
      if (toggleBtn && passwordInput) {
        var eyeOpen = toggleBtn.querySelector(".pw-eye-open");
        var eyeClosed = toggleBtn.querySelector(".pw-eye-closed");

        toggleBtn.addEventListener("click", function () {
          var isPassword = passwordInput.getAttribute("type") === "password";
          passwordInput.setAttribute("type", isPassword ? "text" : "password");
          if (eyeOpen && eyeClosed) {
            eyeOpen.style.display = isPassword ? "none" : "block";
            eyeClosed.style.display = isPassword ? "block" : "none";
          }
        });
      }

      // Theme toggle functionality
      var themeBtn = document.getElementById("authThemeToggle");
      if (themeBtn) {
        themeBtn.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("data-theme") || "light";
          var next = current === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          try { localStorage.setItem("stickpro-theme", next); } catch(e){}
        });
      }

      // Direction toggle functionality
      var dirBtn = document.getElementById("authDirToggle");
      if (dirBtn) {
        dirBtn.addEventListener("click", function () {
          var current = document.documentElement.getAttribute("dir") || "ltr";
          var next = current === "rtl" ? "ltr" : "rtl";
          document.documentElement.setAttribute("dir", next);
          try { localStorage.setItem("stickpro-direction", next); } catch(e){}
        });
      }

      // Sign up form submission simulation
      var form = document.getElementById("signupForm");
      if (form) {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var name = document.getElementById("signupName").value.trim();
          var email = document.getElementById("signupEmail").value.trim();
          var password = document.getElementById("signupPassword").value;
          var agree = document.getElementById("agreeTerms").checked;

          if (!name || !email || !password) {
            alert("Please complete all required fields.");
            return;
          }
          if (password.length < 8) {
            alert("Please provide a password of at least 8 characters.");
            return;
          }
          if (!agree) {
            alert("Please agree to the Terms of Service to create your account.");
            return;
          }

          var btn = document.getElementById("signupSubmitBtn");
          var originalContent = btn.innerHTML;
          btn.innerHTML = '<span>Creating Account...</span>';
          btn.disabled = true;

          setTimeout(function () {
            btn.innerHTML = originalContent;
            btn.disabled = false;
            alert("Welcome to StickPro, " + name + "! Your account has been created.");
            window.location.href = "index.html";
          }, 700);
        });
      }

      // Social button actions
      document.querySelectorAll(".btn-social").forEach(function(button) {
        button.addEventListener("click", function() {
          var provider = this.getAttribute("aria-label") || "third-party";
          alert(provider + " registration connected. Welcome to StickPro!");
          window.location.href = "index.html";
        });
      });
    })();
  </script>
</body>
</html>
